{% extends 'base.html' %}
{% block content %}
    <main>
        <!-- Section 1: HERO / PROFILE -->
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <!-- Section: HERO PHOTO & DETAILS (bio) -->
                <div class="hero-photo">
                    <img class="avatar" src="/static/img/MyFotoGw.png" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <!--    description list -->
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Sesi Terakhir Login</dt>
                            <dd>{{ last_login }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <!-- social media links -->
                        <a href="https://github.com/nasywanamira" class="social-link"><img src="/static/img/github.png" alt="GitHub"></a>
                        <a href="https://www.linkedin.com/in/nasywa-namira-suhendro-/" class="social-link"><img src="/static/img/linkedin.png" alt="LinkedIn"></a>
                        <a href="mailto:nasywa.namira@ui.ac.id" class="social-link"><img src="/static/img/envelope.png" alt="Email"></a>
                    </div>
                </div>
            </div>
        </section>


    </main>
    {% endblock content %}
