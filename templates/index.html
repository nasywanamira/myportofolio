<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/jpg" href="/static/img/favicon.jpg"> <!-- untuk icon bar di tab -->
</head>
<body>
    <!-- HEADER dan my main NAVIGATION gw
     elemen semantik = <header> dan <nav> -->
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">NAMI's PORTOFOLIO</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_education' %}">Education</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Section 1: HERO / PROFILE -->
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <!-- Section: HERO PHOTO & DETAILS (bio) -->
                <div class="hero-photo">
                    <img class="avatar" src="/static/img/MyFotoGw.png" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <!--    description list -->
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <!-- social media links -->
                        <a href="https://github.com/nasywanamira" class="social-link"><img src="/static/img/github.png" alt="GitHub"></a>
                        <a href="https://www.linkedin.com/in/nasywa-namira-suhendro-/" class="social-link"><img src="/static/img/linkedin.png" alt="LinkedIn"></a>
                        <a href="mailto:nasywa.namira@ui.ac.id" class="social-link"><img src="/static/img/envelope.png" alt="Email"></a>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
